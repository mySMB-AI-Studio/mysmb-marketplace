<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unpaid & Aged Accounts — MYOB</title>
<style>
:root{--accent:#6F2CBA;--btn:#5A1F9E;--btn-ink:#FFFFFF;--ink:#393A3D;--muted:#6B6C72;--line:#E3E5E8;--canvas:#F4F5F8;--card:#FFFFFF;--th:#6B6C72;--zebra:transparent;--neg:#D52B1E;--pos:#1B7F4B;--band:#FFFFFF;--band-ink:#393A3D}
:root[data-myhub-theme='dark']{--accent:#A77BE8;--btn:#7A45C9;--btn-ink:#FFFFFF;--ink:#E6E8EB;--muted:#A3A7AE;--line:#33363C;--canvas:#16181B;--card:#1F2226;--th:#A3A7AE;--neg:#FF6B5E;--pos:#4CC38A;--band:#1F2226;--band-ink:#E6E8EB}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font:14px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
#controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px;border-top:3px solid var(--accent)}
.ctl{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.ctl select,.ctl input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:170px}
.ctl select:disabled,.ctl input:disabled{opacity:.6}
.count{margin-left:auto;font-size:12px;color:var(--muted);align-self:center}
.mk-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:12px;border-top:4px solid var(--accent)}
#head{text-align:center;padding:14px 0 18px;background:var(--band);color:var(--band-ink);border-radius:6px;margin-bottom:12px}
#head .ti{font-size:18px;font-weight:700}#head .sub{font-size:13px;margin-top:2px}#head .stamp{font-size:11px;color:var(--muted);margin-top:6px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--th);font-weight:600;text-align:left;padding:8px;border-bottom:2px solid var(--accent)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.mk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.mk-kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px}
.mk-kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.mk-kpi .val{font-size:22px;font-weight:700;margin-top:2px}.mk-kpi .val.neg{color:var(--neg)}
.seg{display:flex;gap:0;margin-bottom:10px}
.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.seg button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chart-heading{font-size:15px;font-weight:600;margin:0 0 10px}
svg{width:100%;height:auto;max-height:260px;display:block}
svg .axis{stroke:var(--line);stroke-width:1}svg .tick{fill:var(--muted);font-size:11px}svg .amt{fill:var(--ink);font-size:12px;font-weight:600}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:13px}
.group-row td{background:var(--canvas);font-weight:600;border-bottom:1px solid var(--line)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.badge.ar{background:#E6F7F5;color:#007A6E}.badge.ap{background:#FDEEE6;color:#C15A1E}
:root[data-myhub-theme='dark'] .badge.ar{background:#15302D;color:#2BC4B3}
:root[data-myhub-theme='dark'] .badge.ap{background:#3A2416;color:#F0924E}
.status-chip{display:inline-block;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.status-chip.overdue{background:#FDECEA;color:#D52B1E}.status-chip.ok{background:#EAF6E8;color:#1B7F4B}
:root[data-myhub-theme='dark'] .status-chip.overdue{background:#3A1B19;color:#FF6B5E}
:root[data-myhub-theme='dark'] .status-chip.ok{background:#18301A;color:#4CC38A}
.draft-btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--btn);background:var(--card);color:var(--btn);border-radius:4px;padding:4px 10px;cursor:pointer}
.draft-btn:hover{background:var(--btn);color:#fff}
.overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay{background:var(--card);border-radius:10px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px 24px}
.overlay h3{margin:0 0 4px}
.overlay .meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.overlay pre{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 14px}
.overlay .actions{display:flex;gap:8px;justify-content:flex-end}
.overlay .actions a,.overlay .actions button{font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:7px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--btn)}
.overlay .actions a{background:var(--btn);color:#fff}
.overlay .actions button{background:var(--card);color:var(--btn)}
#foot{color:var(--muted);font-size:12px;text-align:center;padding:12px 0 4px}
@media (min-width:900px){body{padding-right:64px}}
@media print{#controls,.no-print{display:none!important}}
</style>
</head>
<body>
<div id="controls"></div>
<main class="mk-card">
  <header id="head"></header>
  <div id="body"><p class="muted">Loading MYOB data…</p></div>
  <footer id="foot"></footer>
</main>
<div id="overlay-root"></div>
<script>
(function () {
  "use strict";

  // ---------- small verified helpers (shared pattern used across myob-reporting-studio) ----------
  function num(v) { if (v == null || v === "") return null; var n = Number(String(v).replace(/,/g, "")); return isFinite(n) ? n : null; }
  function errorOf(v) { return v && typeof v === "object" && !Array.isArray(v) && v.__error != null ? String(v.__error) : null; }
  function items(v) { return !v || errorOf(v) ? [] : Array.isArray(v) ? v : Array.isArray(v.Items) ? v.Items : []; }
  function D(y, m, d) { return new Date(Date.UTC(y, m - 1, d)); }
  function iso(dt) { return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") + "-" + String(dt.getUTCDate()).padStart(2, "0"); }
  function parseIso(s) { var p = String(s).split("-"); return D(+p[0], +p[1], +p[2]); }
  function addDays(dt, n) { return new Date(dt.getTime() + n * 86400000); }
  function eom(y, m) { return D(y, m + 1, 0); }
  function today() { var t = new Date(); return D(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  function isoDate(v) {
    if (v == null || v === "") return null;
    var m = /\/Date\((-?\d+)/.exec(String(v));
    if (m) { var d = new Date(+m[1]); return iso(D(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate())); }
    return String(v).slice(0, 10);
  }
  function auDate(isoStr) { if (!isoStr) return "—"; var p = isoStr.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function money(v) {
    if (v == null || !isFinite(Number(v))) return "—";
    var n = Number(v), neg = n < 0, abs = Math.abs(n).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (neg ? "-" : "") + "$" + abs;
  }
  function h(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  // ---------- period presets ----------
  function fyStart(d) { var y = d.getUTCFullYear(); if (d.getUTCMonth() + 1 < 7) y -= 1; return D(y, 7, 1); }
  var PERIODS = [["all", "All time"], ["this_month", "This month"], ["last_month", "Last month"], ["this_quarter", "This quarter"], ["last_quarter", "Last quarter"], ["this_fy", "This financial year"], ["last_fy", "Last financial year"], ["custom", "Custom range"]];
  function periodRange(key) {
    var t = today(), y = t.getUTCFullYear(), m = t.getUTCMonth() + 1, qs = Math.floor((m - 1) / 3) * 3 + 1;
    switch (key) {
      case "this_month": return [D(y, m, 1), eom(y, m)];
      case "last_month": return [D(y, m - 1, 1), eom(y, m - 1)];
      case "this_quarter": return [D(y, qs, 1), eom(y, qs + 2)];
      case "last_quarter": return [D(y, qs - 3, 1), eom(y, qs - 1)];
      case "this_fy": { var fs = fyStart(t); return [fs, addDays(D(fs.getUTCFullYear() + 1, fs.getUTCMonth() + 1, 1), -1)]; }
      case "last_fy": { var fs2 = fyStart(t); return [D(fs2.getUTCFullYear() - 1, 7, 1), addDays(fs2, -1)]; }
      default: return null; // "all" / "custom" (custom handled via state.customFrom/To directly)
    }
  }

  // ---------- state ----------
  var MH = window.MyHubReport;
  var live = !!(MH && MH.mode !== "snapshot");
  var S = {
    companyFiles: [],           // [{id,name}]
    ar: [], ap: [], contacts: [], // currently loaded (post organisation selection), raw rows tagged with _orgId/_orgName
    org: "",                    // "" once companyFiles load = first file's id; "__all__" = every file
    client: "",                 // contact key ("" = all)
    period: "all",
    customFrom: "", customTo: "",
    chartSide: "AR",
    loading: true,
    draft: null                 // {subject, body, mailto} while the review overlay is open
  };

  function $(id) { return document.getElementById(id); }

  // ---------- data loading ----------
  function companyFiles(v) {
    return items(v).map(function (f) { return { id: String(f.Id || f.id || ""), name: f.Name || f.name || "" }; }).filter(function (f) { return f.id; });
  }

  function fetchOne(id, companyFileId) {
    if (!MH || !live) return Promise.resolve(null);
    return MH.getData(id, { company_file: companyFileId }).catch(function (e) {
      console.error("[unpaid-aged-accounts-myob] " + id + " failed for " + companyFileId + ":", e);
      return null;
    });
  }

  function loadOrg(org) {
    S.loading = true; render();
    if (org === "__all__") {
      return Promise.all(S.companyFiles.map(function (f) {
        return Promise.all([fetchOne("invoices", f.id), fetchOne("bills", f.id), fetchOne("contacts", f.id)])
          .then(function (r) { return { file: f, inv: items(r[0]), bills: items(r[1]), contacts: items(r[2]) }; });
      })).then(function (results) {
        var ar = [], ap = [], contacts = [];
        results.forEach(function (r) {
          r.inv.forEach(function (i) { i._orgId = r.file.id; i._orgName = r.file.name; ar.push(i); });
          r.bills.forEach(function (b) { b._orgId = r.file.id; b._orgName = r.file.name; ap.push(b); });
          r.contacts.forEach(function (c) { c._orgId = r.file.id; contacts.push(c); });
        });
        S.ar = ar; S.ap = ap; S.contacts = contacts; S.loading = false;
        S.client = ""; render();
      });
    }
    return Promise.all([fetchOne("invoices", org), fetchOne("bills", org), fetchOne("contacts", org)]).then(function (r) {
      var orgName = (S.companyFiles.filter(function (f) { return f.id === org; })[0] || {}).name || "";
      S.ar = items(r[0]).map(function (i) { i._orgId = org; i._orgName = orgName; return i; });
      S.ap = items(r[1]).map(function (b) { b._orgId = org; b._orgName = orgName; return b; });
      S.contacts = items(r[2]).map(function (c) { c._orgId = org; return c; });
      S.loading = false; S.client = ""; render();
    });
  }

  // ---------- shaping ----------
  function shapeInvoice(i) {
    var bal = num(i.BalanceDueAmount) || 0;
    if (bal === 0) return null;
    var cu = i.Customer || {};
    var date = isoDate(i.Date), due = isoDate((i.Terms || {}).DueDate) || date;
    return { type: "AR", key: cu.UID || cu.Name || "(no customer)", name: cu.Name || "(no customer)", number: i.Number || "", date: date, due: due, balance: bal, age: Math.round((today() - parseIso(due)) / 86400000), orgId: i._orgId, orgName: i._orgName };
  }
  function shapeBill(b) {
    var bal = num(b.BalanceDueAmount) || 0;
    if (bal === 0) return null;
    var cu = b.Supplier || {};
    var date = isoDate(b.Date), due = isoDate((b.Terms || {}).DueDate) || date;
    return { type: "AP", key: cu.UID || cu.Name || "(no supplier)", name: cu.Name || "(no supplier)", number: b.Number || "", date: date, due: due, balance: bal, age: Math.round((today() - parseIso(due)) / 86400000), orgId: b._orgId, orgName: b._orgName };
  }
  function contactEmail(key) {
    var c = S.contacts.filter(function (x) { return x.UID === key || x.CompanyName === key; })[0];
    if (!c) return "";
    var addr = (c.Addresses || []).filter(function (a) { return a && a.Email; })[0];
    return addr ? addr.Email : "";
  }

  function allAR() { return items2(S.ar, shapeInvoice); }
  function allAP() { return items2(S.ap, shapeBill); }
  function items2(arr, shaper) { var out = []; arr.forEach(function (x) { var s = shaper(x); if (s) out.push(s); }); return out; }

  function inPeriod(dateIso) {
    if (S.period === "all") return true;
    var range = S.period === "custom" ? (S.customFrom && S.customTo ? [parseIso(S.customFrom), parseIso(S.customTo)] : null) : periodRange(S.period);
    if (!range) return true;
    var d = parseIso(dateIso);
    return d >= range[0] && d <= range[1];
  }
  function inClient(row) { return !S.client || row.key === S.client; }

  function filteredAR() { return allAR().filter(function (r) { return inPeriod(r.date) && inClient(r); }); }
  function filteredAP() { return allAP().filter(function (r) { return inPeriod(r.date) && inClient(r); }); }

  function clientOptions() {
    var seen = {}, out = [];
    allAR().concat(allAP()).forEach(function (r) { if (!seen[r.key]) { seen[r.key] = 1; out.push({ key: r.key, name: r.name }); } });
    out.sort(function (a, b) { return a.name.localeCompare(b.name); });
    return out;
  }

  var COLS = ["Current", "1-30", "31-60", "61-90", "90+"];
  function bucketOf(age) { return age <= 0 ? 0 : age <= 30 ? 1 : age <= 60 ? 2 : age <= 90 ? 3 : 4; }
  function buckets(rows) {
    var b = COLS.map(function () { return 0; });
    rows.forEach(function (r) { var i = bucketOf(r.age); b[i] = Math.round((b[i] + r.balance) * 100) / 100; });
    return b;
  }

  // ---------- rendering ----------
  function opt(list, cur) { return list.map(function (o) { return "<option value=\"" + h(o[0]) + "\"" + (String(o[0]) === String(cur) ? " selected" : "") + ">" + h(o[1]) + "</option>"; }).join(""); }

  function renderControls() {
    var el = $("controls"); if (!el) return;
    var dis = live ? "" : " disabled";
    var orgOpts = [["__all__", "All organisations"]].concat(S.companyFiles.map(function (f) { return [f.id, f.name]; }));
    var clientOpts = [["", "All clients"]].concat(clientOptions().map(function (c) { return [c.key, c.name]; }));
    var x = "";
    x += "<label class=\"ctl\">Organisation<select id=\"ctl-org\"" + dis + ">" + opt(orgOpts, S.org) + "</select></label>";
    x += "<label class=\"ctl\">Client<select id=\"ctl-client\"" + dis + ">" + opt(clientOpts, S.client) + "</select></label>";
    x += "<label class=\"ctl\">Period<select id=\"ctl-period\"" + dis + ">" + opt(PERIODS, S.period) + "</select></label>";
    if (S.period === "custom") {
      x += "<label class=\"ctl\">From<input type=\"date\" id=\"ctl-from\" value=\"" + h(S.customFrom) + "\"" + dis + "></label>";
      x += "<label class=\"ctl\">To<input type=\"date\" id=\"ctl-to\" value=\"" + h(S.customTo) + "\"" + dis + "></label>";
    }
    var count = filteredAR().length + filteredAP().length;
    x += "<div class=\"count\">" + count + " outstanding item" + (count === 1 ? "" : "s") + "</div>";
    el.innerHTML = x;
    on("ctl-org", "change", function () { S.org = this.value; loadOrg(S.org); });
    on("ctl-client", "change", function () { S.client = this.value; render(); });
    on("ctl-period", "change", function () { S.period = this.value; render(); });
    on("ctl-from", "change", function () { S.customFrom = this.value; render(); });
    on("ctl-to", "change", function () { S.customTo = this.value; render(); });
  }
  function on(id, ev, fn) { var e = $(id); if (e) e.addEventListener(ev, fn); }

  function renderHead() {
    var el = $("head"); if (!el) return;
    el.innerHTML = "<div class=\"ti\">Unpaid &amp; Aged Accounts — MYOB</div>" +
      "<div class=\"sub\">Aged receivables and payables, grouped by contact and ageing bucket.</div>" +
      "<div class=\"stamp\">Last refreshed " + new Date().toLocaleString("en-AU") + "</div>";
  }

  function renderTiles(ar, ap) {
    var totalAR = ar.reduce(function (s, r) { return s + r.balance; }, 0);
    var totalAP = ap.reduce(function (s, r) { return s + r.balance; }, 0);
    var overdueAR = ar.filter(function (r) { return r.age > 0; }).reduce(function (s, r) { return s + r.balance; }, 0);
    var overdueAP = ap.filter(function (r) { return r.age > 0; }).reduce(function (s, r) { return s + r.balance; }, 0);
    var net = totalAR - totalAP;
    var tiles = [
      { label: "Total Receivable", value: totalAR },
      { label: "Total Payable", value: totalAP },
      { label: "Net Position", value: net },
      { label: "Overdue AR", value: overdueAR },
      { label: "Overdue AP", value: overdueAP }
    ];
    return "<div class=\"mk-kpis\">" + tiles.map(function (t) {
      return "<div class=\"mk-kpi\"><div class=\"lbl\">" + h(t.label) + "</div><div class=\"val" + (t.value < 0 ? " neg" : "") + "\">" + money(t.value) + "</div></div>";
    }).join("") + "</div>";
  }

  function renderChart(ar, ap) {
    var rows = S.chartSide === "AR" ? ar : ap;
    var b = buckets(rows), total = b.reduce(function (s, v) { return s + v; }, 0);
    var W = 640, H = 230, P = 32, maxV = Math.max.apply(null, b.concat([1]));
    var gw = (W - P * 2) / COLS.length, bw = gw * 0.5;
    function y(v) { return H - P - 20 - (v / maxV) * (H - P * 2 - 20); }
    var svg = "<svg viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"Ageing buckets\"><line x1=\"" + P + "\" x2=\"" + (W - P) + "\" y1=\"" + y(0) + "\" y2=\"" + y(0) + "\" class=\"axis\"/>";
    COLS.forEach(function (lb, i) {
      var v = b[i], x = P + gw * i + (gw - bw) / 2, y1 = y(v);
      svg += "<rect x=\"" + x.toFixed(1) + "\" y=\"" + y1.toFixed(1) + "\" width=\"" + bw.toFixed(1) + "\" height=\"" + Math.max(1, y(0) - y1).toFixed(1) + "\" fill=\"#34DFBA\"/>";
      svg += "<text x=\"" + (x + bw / 2).toFixed(1) + "\" y=\"" + (y1 - 6).toFixed(1) + "\" class=\"amt\" text-anchor=\"middle\">" + h(money(v)) + "</text>";
      svg += "<text x=\"" + (x + bw / 2).toFixed(1) + "\" y=\"" + (H - 8) + "\" class=\"tick\" text-anchor=\"middle\">" + h(lb) + "</text>";
    });
    svg += "</svg>";
    var heading = (S.chartSide === "AR" ? "Accounts Receivable" : "Accounts Payable") + " — " + money(total);
    return "<div class=\"mk-card\"><div class=\"seg no-print\">" +
      "<button type=\"button\" id=\"chart-ar\" class=\"" + (S.chartSide === "AR" ? "active" : "") + "\">Accounts Receivable</button>" +
      "<button type=\"button\" id=\"chart-ap\" class=\"" + (S.chartSide === "AP" ? "active" : "") + "\">Accounts Payable</button>" +
      "</div><h3 class=\"chart-heading\">" + h(heading) + "</h3>" + (total ? svg : "<p class=\"empty\">No data available.</p>") + "</div>";
  }

  function groupRows(rows) {
    var byKey = {};
    rows.forEach(function (r) {
      var gk = r.type + "::" + r.key;
      if (!byKey[gk]) byKey[gk] = { type: r.type, key: r.key, name: r.name, items: [], total: 0, maxAge: -Infinity };
      var g = byKey[gk];
      g.items.push(r); g.total = Math.round((g.total + r.balance) * 100) / 100; g.maxAge = Math.max(g.maxAge, r.age);
    });
    var groups = Object.keys(byKey).map(function (k) { return byKey[k]; });
    groups.sort(function (a, b) { return b.total - a.total; });
    groups.forEach(function (g) { g.items.sort(function (a, b) { return parseIso(a.due) - parseIso(b.due); }); });
    return groups;
  }

  function renderTable(ar, ap) {
    var groups = groupRows(ar.concat(ap));
    if (!groups.length) return "<div class=\"mk-card\"><h3>Outstanding Items</h3><p class=\"empty\">No data available.</p></div>";
    var rowsHtml = "";
    groups.forEach(function (g, gi) {
      rowsHtml += "<tr class=\"group-row\"><td colspan=\"5\">" + h(g.name) +
        "<span class=\"badge " + (g.type === "AR" ? "ar" : "ap") + "\">" + g.type + "</span>" +
        " &nbsp;·&nbsp; " + g.items.length + " item" + (g.items.length === 1 ? "" : "s") +
        " &nbsp;·&nbsp; " + money(g.total) +
        " &nbsp;·&nbsp; " + (g.maxAge > 0 ? g.maxAge + " day(s) overdue (oldest)" : "Not yet due") +
        "</td><td class=\"num\"><button type=\"button\" class=\"draft-btn no-print\" data-group=\"" + gi + "\">Draft Email</button></td></tr>";
      g.items.forEach(function (it) {
        var statusCell = "<td class=\"muted\" style=\"padding-left:20px\">" + (it.age > 0 ? "<span class=\"status-chip overdue\">" + it.age + "d overdue</span>" : "<span class=\"status-chip ok\">Not yet due</span>") + "</td>";
        rowsHtml += "<tr>" + statusCell + "<td>" + h(it.number) + "</td><td>" + h(auDate(it.date)) + "</td><td>" + h(auDate(it.due)) +
          "</td><td class=\"num\">" + h(money(it.balance)) + "</td></tr>";
      });
    });
    S._groups = groups;
    return "<div class=\"mk-card\"><h3>Outstanding Items</h3><div style=\"overflow-x:auto\"><table><thead><tr><th>Status</th><th>Ref #</th><th>Date</th><th>Due</th><th class=\"num\">Amount</th></tr></thead><tbody>" + rowsHtml + "</tbody></table></div></div>";
  }

  function buildDraft(group) {
    var email = contactEmail(group.key);
    var lines = [];
    if (group.type === "AR") {
      lines.push("Hi " + (group.name || "there") + ",");
      lines.push("");
      lines.push("This is a friendly reminder that the following invoice(s) remain outstanding:");
      lines.push("");
      group.items.forEach(function (it) {
        lines.push(it.number + "  |  Invoice date: " + auDate(it.date) + "  |  Due: " + auDate(it.due) + "  |  Amount: " + money(it.balance) + (it.age > 0 ? "  |  " + it.age + " day(s) overdue" : "  |  Not yet due"));
      });
      lines.push("");
      lines.push("Total outstanding: " + money(group.total));
      lines.push("");
      lines.push("Could you please arrange payment at your earliest convenience, or let us know if you have any queries regarding these invoices?");
      lines.push("");
      lines.push("Kind regards,");
    } else {
      lines.push("Hi " + (group.name || "there") + ",");
      lines.push("");
      lines.push("Just a note to let you know we're finalising payment for the following bill(s):");
      lines.push("");
      group.items.forEach(function (it) {
        lines.push(it.number + "  |  Date: " + auDate(it.date) + "  |  Due: " + auDate(it.due) + "  |  Amount: " + money(it.balance));
      });
      lines.push("");
      lines.push("Total: " + money(group.total));
      lines.push("");
      lines.push("Kind regards,");
    }
    var subject = (group.type === "AR" ? "Payment reminder — " : "Bills being processed — ") + group.name;
    return { to: email, subject: subject, body: lines.join("\n") };
  }

  function renderOverlay() {
    var root = $("overlay-root");
    if (!S.draft) { root.innerHTML = ""; return; }
    var d = S.draft, mailto = "mailto:" + encodeURIComponent(d.to || "") + "?subject=" + encodeURIComponent(d.subject) + "&body=" + encodeURIComponent(d.body);
    root.innerHTML = "<div class=\"overlay-bg\" id=\"overlay-bg\"><div class=\"overlay\">" +
      "<h3>" + h(d.subject) + "</h3>" +
      "<div class=\"meta\">" + (d.to ? "To: " + h(d.to) : "No email on file for this contact — add a recipient in your email client.") + "</div>" +
      "<pre>" + h(d.body) + "</pre>" +
      "<div class=\"actions\"><button type=\"button\" id=\"overlay-close\">Close</button><a href=\"" + mailto + "\" id=\"overlay-open\">Open in email client</a></div>" +
      "</div></div>";
    on("overlay-bg", "click", function (e) { if (e.target.id === "overlay-bg") { S.draft = null; renderOverlay(); } });
    on("overlay-close", "click", function () { S.draft = null; renderOverlay(); });
  }

  function render() {
    renderHead();
    var body = $("body");
    if (S.loading) { body.innerHTML = "<p class=\"muted\">Loading MYOB data…</p>"; renderControls(); return; }
    var ar = filteredAR(), ap = filteredAP();
    renderControls();
    body.innerHTML = renderTiles(ar, ap) + renderChart(ar, ap) + renderTable(ar, ap);
    on("chart-ar", "click", function () { S.chartSide = "AR"; render(); });
    on("chart-ap", "click", function () { S.chartSide = "AP"; render(); });
    document.querySelectorAll(".draft-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var g = S._groups[Number(btn.getAttribute("data-group"))];
        S.draft = buildDraft(g); renderOverlay();
      });
    });
    var ft = $("foot");
    if (ft) ft.textContent = "Prepared from MYOB Business · myob-accounting connector (MYOB Business API v2) · figures reflect each invoice/bill's balance due today.";
  }

  // ---------- boot ----------
  function boot(bundle) {
    S.companyFiles = companyFiles(bundle.data && bundle.data.company_files);
    if (!S.companyFiles.length) {
      S.loading = false;
      $("body").innerHTML = "<p class=\"empty\">No data available.</p>";
      renderControls(); renderHead();
      return;
    }
    S.org = S.companyFiles[0].id;
    loadOrg(S.org);
  }

  if (MH) {
    window.MyHubReport.onData(boot);
    if (MH.onThemeChange) MH.onThemeChange(function () { render(); });
  } else {
    $("body").innerHTML = "<p class=\"empty\">Open this report in mySMB to load MYOB data.</p>";
  }
})();
</script>
</body>
</html>
