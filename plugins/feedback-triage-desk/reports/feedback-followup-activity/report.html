<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback follow-up activity</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: var(--foreground, inherit); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted-foreground, inherit); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border, currentColor); }
  td.num, th.num { text-align: right; }
  .empty { padding: 24px 0; }
</style>
</head>
<body>
<h1>Feedback follow-up activity</h1>
<p class="sub" id="asof">Loading…</p>
<table>
  <thead><tr><th>Person</th><th class="num">Created</th><th class="num">Completed</th><th class="num">Open now</th><th class="num">Overdue</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
  MyHubReport.onData(function (bundle) {
    var data = bundle.data.activity || {};
    var team = bundle.data.team || {};
    var names = {};
    (team.users || []).forEach(function (u) { if (u && u.userId) names[u.userId] = u.name; });
    var users = (data.users || []).filter(function (u) { return (u.created || u.completed || u.open || u.overdue) && names[u.userId]; });
    users.sort(function (a, b) { return (b.open || 0) - (a.open || 0); });
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    if (!users.length) tbody.innerHTML = '<tr><td colspan="5" class="empty">No WorkQ activity in this period.</td></tr>';
    users.forEach(function (u) {
      var tr = document.createElement('tr');
      [names[u.userId], u.created || 0, u.completed || 0, u.open || 0, u.overdue || 0].forEach(function (v, i) {
        var td = document.createElement('td'); td.textContent = String(v); if (i > 0) td.className = 'num'; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    var t = data.totals || {};
    document.getElementById('asof').textContent = 'Last ' + (data.periodDays || '') + ' days · ' + users.length + ' people · ' + (t.created || 0) + ' created, ' + (t.completed || 0) + ' completed, ' + (t.overdue || 0) + ' overdue';
  });
</script>
</body>
</html>
