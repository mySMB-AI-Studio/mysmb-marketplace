<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback follow-up activity</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: var(--foreground, inherit); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted-foreground, inherit); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border, currentColor); }
  td.num, th.num { text-align: right; }
  .empty { padding: 24px 0; }
</style>
</head>
<body>
<h1>Feedback follow-up activity</h1>
<p class="sub" id="asof">Loading…</p>
<table>
  <thead><tr><th>Person</th><th class="num">Created</th><th class="num">Completed</th><th class="num">Open now</th><th class="num">Overdue</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
  function pick(o, keys) { for (var i = 0; i < keys.length; i++) { if (o && o[keys[i]] != null) return o[keys[i]]; } return 0; }
  MyHubReport.onData(function () {
    var data = MyHubReport.getData('activity') || {};
    var users = data.users || data.perUser || data.rows || [];
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    if (!users.length) tbody.innerHTML = '<tr><td colspan="5" class="empty">No WorkQ activity in this period.</td></tr>';
    users.forEach(function (u) {
      var tr = document.createElement('tr');
      [u.name || u.displayName || u.email || 'Someone', pick(u, ['itemsCreated', 'created']), pick(u, ['itemsCompleted', 'completed']), pick(u, ['openNow', 'open']), pick(u, ['overdueNow', 'overdue'])].forEach(function (v, i) {
        var td = document.createElement('td'); td.textContent = String(v); if (i > 0) td.className = 'num'; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    document.getElementById('asof').textContent = 'As of ' + new Date().toLocaleDateString() + ' · ' + users.length + ' people';
  });
</script>
</body>
</html>
