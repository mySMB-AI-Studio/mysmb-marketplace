<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBooks Financial Overview</title>
<style>:root{--accent:#2CA01C;--btn:#236B32;--btn-ink:#FFFFFF;--ink:#393A3D;--muted:#6B6C72;--line:#E3E5E8;--canvas:#F4F5F8;--card:#FFFFFF;--th:#6B6C72;--zebra:transparent;--neg:#D52B1E;--pos:#2CA01C;--pass-bg:#EAF6E8;--fail-bg:#FDECEA;--band:#FFFFFF;--band-ink:#393A3D;--cover:#1B2A4A;--cover-ink:#FFFFFF;--c1:#2CA01C;--c2:#8D9096;--c3:#0077C5;--c4:#00A6A4;--c5:#7B61FF;--c6:#E0457B;--d1:#2CA01C;--d2:#00A6A4;--d3:#7B61FF;--d4:#E0457B;--d5:#0077C5;--d6:#8D9096}
:root[data-myhub-theme='dark']{--accent:#53C43F;--btn:#2E8B41;--btn-ink:#FFFFFF;--ink:#E6E8EB;--muted:#A3A7AE;--line:#33363C;--canvas:#16181B;--card:#1F2226;--th:#A3A7AE;--neg:#FF6B5E;--pos:#53C43F;--pass-bg:#18301A;--fail-bg:#3A1B19;--band:#1F2226;--band-ink:#E6E8EB;--cover:#22324F;--cover-ink:#FFFFFF;--c1:#53C43F;--c2:#80858D;--c3:#3FA2E8;--c4:#2CC7C4;--c5:#9A86FF;--c6:#F06A96;--d1:#53C43F;--d2:#2CC7C4;--d3:#9A86FF;--d4:#F06A96;--d5:#3FA2E8;--d6:#80858D}
:root.style-mysmb{--accent:#007A6E;--btn:#007A6E;--zebra:#E6F7F5;--band:#007A6E;--band-ink:#FFFFFF;--cover:#007A6E;--c1:#007A6E;--c3:#00B0A0;--d1:#007A6E;--d2:#00B0A0;--pos:#007A6E}
:root[data-myhub-theme='dark'].style-mysmb{--accent:#2BB3A3;--btn:#138A7D;--zebra:#15302D;--band:#0E5A52;--band-ink:#FFFFFF;--cover:#0E5A52;--c1:#2BB3A3;--c3:#3CCFBF;--d1:#2BB3A3;--d2:#3CCFBF;--pos:#2BB3A3}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font:14px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
#qb-controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.ctl{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.ctl select,.ctl input[type=date],.qb-filter{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.ctl select:disabled,.ctl input:disabled{opacity:.6}
.seg{border:0;padding:0;margin:0;flex-direction:row;gap:0}
.seg legend{font-size:12px;color:var(--muted);padding:0 0 4px}
.seg label{border:1px solid var(--line);padding:6px 12px;color:var(--ink);cursor:pointer;font-size:13px}
.seg label:first-of-type{border-radius:4px 0 0 4px}.seg label:last-of-type{border-radius:0 4px 4px 0;border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600}
.customise summary{cursor:pointer;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px}
.cz{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:6px 16px;padding:8px 0;font-size:13px;color:var(--ink)}
.btns{flex-direction:row;gap:8px;margin-left:auto}
.btns button,.btns a{font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:7px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--btn);background:var(--card);color:var(--btn)}
.btns button#qb-xlsx{background:var(--btn);color:var(--btn-ink)}
#qb-status{font-size:12px;color:var(--muted);min-height:16px;margin:0 0 6px}
.qb-banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;border:1px solid var(--line)}
.qb-banner.pass{background:var(--pass-bg)}.qb-banner.na{border-color:var(--muted)}.qb-banner.fail{background:var(--fail-bg);border-color:var(--neg)}
.qb-banner ul{margin:6px 0 0;padding-left:18px}.qb-banner li.bad{color:var(--neg);font-weight:600}.qb-banner li.na{color:var(--muted)}
.qb-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:12px}
#qb-head{text-align:center;padding:8px 0 16px;background:var(--band);color:var(--band-ink);border-radius:6px}
:root.style-mysmb #qb-head{text-align:left;padding:14px 18px;margin-bottom:12px}
#qb-head .co{font-size:18px;font-weight:700}#qb-head .ti{font-size:14px}#qb-head .pe{font-size:14px;font-weight:600}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-variant:small-caps;letter-spacing:.04em;text-transform:lowercase;color:var(--th);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.qb-grid th{cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zebra)}
.num{text-align:right;white-space:nowrap}
.k-header td{font-weight:600;border-bottom:0}.k-total td{font-weight:700;border-top:1px solid var(--ink)}
.neg{color:var(--neg)}
.muted{color:var(--muted)}.qb-err{color:var(--neg)}
.qb-scroll{overflow-x:auto}
.qb-filter{margin:0 0 8px;min-width:220px}
:root.dens-compact td{padding:3px 8px}:root.dens-compact body{font-size:12.5px}
.qb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.qb-kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.qb-kpi .lbl{font-size:11px;font-variant:small-caps;text-transform:lowercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.qb-kpi .val{font-size:22px;font-weight:700;margin-top:2px}.qb-kpi .sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;margin-top:4px}
.chip.up{background:var(--pass-bg);color:var(--pos)}.chip.down{background:var(--fail-bg);color:var(--neg)}
.qb-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.qb-card h2,.qb-card h3{font-size:15px;margin:0 0 10px}
svg{width:100%;height:auto;max-height:300px;display:block;margin:0 auto}svg .axis{stroke:var(--line);stroke-width:1}svg .tick{fill:var(--muted);font-size:11px}
svg .donut-c{fill:var(--ink);font-size:15px;font-weight:700}
.qb-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.qb-legend i,.qb-donut li i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.qb-donut{display:flex;gap:16px;align-items:center}.qb-donut svg{max-width:180px}.qb-donut ul{list-style:none;padding:0;margin:0;font-size:13px}.qb-donut li{margin:3px 0}
#qb-foot{color:var(--muted);font-size:12px;text-align:center;padding:12px 0 4px}
#qb-sources{font-size:12.5px;color:var(--muted)}#qb-sources h2{font-size:13px;color:var(--ink)}
.persona-summary .detail-block{display:none}
.persona-summary .keep-detail tr.detail-block{display:table-row}
.skel{height:14px;border-radius:4px;background:var(--line);margin:8px 0;opacity:.6}
.page{break-after:page}
@media (max-width:720px){.btns{margin-left:0}.cz{grid-template-columns:1fr}}
@media print{body{background:var(--card);padding:0}#qb-controls,#qb-status,.no-print,.qb-filter{display:none!important}.qb-card{border:0;padding:0 0 12px}th{position:static}@page{size:A4 portrait;margin:14mm}}
/* QuickBooks branding accents (the accent follows the house-style toggle and the optional brand colour) */
#qb-controls{border-top:3px solid var(--accent)}
main.qb-card{border-top:4px solid var(--accent)}
.qb-kpi{border-left:4px solid var(--accent)}
.qb-stmt thead th,.qb-grid thead th{border-bottom:2px solid var(--accent)}
.qb-src{font-size:12px;color:var(--muted);margin-top:4px}.qb-src i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
:root.style-mysmb #qb-head .qb-src{color:var(--band-ink);opacity:.85}:root.style-mysmb #qb-head .qb-src i{background:var(--band-ink)}
/* keep the right-hand amounts clear of the workspace's floating chat button */
@media (min-width:900px){body{padding-right:64px}}
@media print{body{padding-right:0}}</style>

<body class="persona-detail">
<div id="qb-controls" aria-label="Report controls"></div>
<div id="qb-status" role="status" aria-live="polite">Loading QuickBooks data…</div>
<div id="qb-banner" class="qb-banner" role="region" aria-label="Validation"></div>
<main class="qb-card">
<header id="qb-head"></header>
<div id="qb-body"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<footer id="qb-foot"></footer>
</main>
<section id="qb-sources" class="qb-card" aria-label="Sources and limitations"></section>
<script>var QB = (function () {
  'use strict';
  // ---------- numbers & labels ----------
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(String(v).replace(/,/g, ''));
    return isFinite(n) ? n : null;
  }
  function cd(node) { return ((node && node.ColData) || []).map(function (c) { return c && c.value != null ? c.value : ''; }); }
  function totalFor(label) { return /^Total\s+(?!for\s)/i.test(label) ? label.replace(/^Total\s+/i, 'Total for ') : label; }
  function near(a, b, tol) { return a != null && b != null && Math.abs(a - b) <= (tol == null ? 0.01 : tol); }
  function sum(arr) { var s = 0; arr.forEach(function (v) { if (v != null) s += v; }); return Math.round(s * 100) / 100; }

  // ---------- QBO report tree (Header / Columns / Rows) ----------
  // A column can nest sub-columns (ItemSales: "Total" › Quantity, Amount, % of Sales, Avg Price, COGS, Gross Margin…) while
  // each row's ColData is flat — one value per leaf. So the leaves are the columns; group = the parent's title (live QA, 4 Oct 2026).
  function cols(rep) {
    var out = [];
    (function add(list, group) {
      (list || []).forEach(function (c) {
        var sub = c.Columns && c.Columns.Column; if (sub && sub.length) { add(sub, c.ColTitle || ''); return; }
        var key = null, sd = null, ed = null;
        (c.MetaData || []).forEach(function (m) { if (m.Name === 'ColKey') key = m.Value; if (m.Name === 'StartDate') sd = m.Value; if (m.Name === 'EndDate') ed = m.Value; });
        out.push({ i: out.length, title: c.ColTitle || '', type: c.ColType || '', key: key, start: sd, end: ed, group: group });
      });
    })(rep && rep.Columns && rep.Columns.Column, null);
    return out;
  }
  // Flattens the nested report. kind: 'header' | 'row' | 'total'. values = numeric columns 1..n (col 0 is the label).
  function walk(rep) {
    var out = [];
    function rec(rows, depth, path) {
      (rows || []).forEach(function (r) {
        var group = r.group || '';
        if (r.Header || (r.Rows && r.Rows.Row)) {
          var h = cd(r.Header), label = h[0] || '';
          out.push({ kind: 'header', depth: depth, label: label, group: group, path: path.slice(), values: h.slice(1).map(num), raw: h.slice(1) });
          rec(r.Rows && r.Rows.Row, depth + 1, path.concat(label));
          if (r.Summary) { var s = cd(r.Summary); out.push({ kind: 'total', depth: depth, label: s[0] || '', group: group, path: path.slice(), values: s.slice(1).map(num), raw: s.slice(1) }); }
        } else if (r.ColData) {
          var d = cd(r), c0 = r.ColData[0] || {};
          out.push({ kind: 'row', depth: depth, label: d[0] || '', id: c0.id || null, group: group, path: path.slice(), values: d.slice(1).map(num), raw: d.slice(1) });
        } else if (r.Summary) {
          var t = cd(r.Summary);
          out.push({ kind: 'total', depth: depth, label: t[0] || '', group: group, path: path.slice(), values: t.slice(1).map(num), raw: t.slice(1) });
        }
      });
    }
    rec(rep && rep.Rows && rep.Rows.Row, 0, []);
    return out;
  }
  // Find a line: by QBO group first (stable: Income, COGS, GrossProfit, Expenses, OtherIncome, OtherExpenses, NetIncome, TotalAssets...), else by label regex.
  // With no kind given, a total is preferred, then a Data row, then a header that carries amounts (QuickBooks puts some
  // summary lines — e.g. Cash at end of period — in different shapes per company).
  function find(rows, group, labelRe, kind) {
    var kinds = kind ? [kind] : ['total', 'row', 'header'], i, j, k, ok = function (l) { return kind || l.kind !== 'header' || l.values.some(function (v) { return v != null; }); }; // fallback headers only when they carry amounts
    for (j = 0; j < kinds.length; j++) { k = kinds[j];
      if (group) for (i = 0; i < rows.length; i++) if (rows[i].group === group && rows[i].kind === k && ok(rows[i])) return rows[i];
      if (labelRe) for (i = 0; i < rows.length; i++) if (rows[i].kind === k && labelRe.test(rows[i].label) && ok(rows[i])) return rows[i];
    }
    return null;
  }
  // Statement of Cash Flows summary lines (US and AU / IFRS wording)
  var CF_END_RE = /^(cash( and cash equivalents)? at (the )?end of (the )?(period|year|month)|closing cash( balance)?)$/i,
    CF_BEG_RE = /^(cash( and cash equivalents)? at (the )?beginning of (the )?(period|year|month)|opening cash( balance)?)$/i,
    CF_INC_RE = /^net (cash )?(increase|decrease|change)( \(decrease\))?( in cash( and cash equivalents)?)?( for (the )?(period|year))?$/i;
  // Closing cash by month. US reports carry a "Cash at end of period" line; AU / IFRS reports carry only the net increase,
  // so month-ends are worked back from a known closing balance (bank accounts today, or on the balance sheet at the end date).
  function cashEnd(lines, idx, closing) {
    var endL = find(lines, 'EndingCash', CF_END_RE); if (endL) return endL;
    var incL = find(lines, 'CashIncrease', CF_INC_RE); if (!incL || closing == null || !idx.length) return null;
    var vals = incL.values.map(function () { return null; }), run = closing, r2 = function (v) { return Math.round(v * 100) / 100; };
    for (var j = idx.length - 1; j >= 0; j--) { vals[idx[j]] = r2(run); run -= incL.values[idx[j]] || 0; }
    if (idx.indexOf(vals.length - 1) < 0) vals[vals.length - 1] = r2(closing); // Total column = closing cash
    return { kind: 'row', label: 'Cash at end of period', values: vals, derived: true, open: r2(run) };
  }
  // Cash on a balance sheet = the rows for bank accounts (matched by account Id from list_account)
  function bankCash(bsRep, accounts) {
    var ids = {}, hit = false, tot = 0; (accounts || []).forEach(function (a) { if (a.AccountType === 'Bank') ids[String(a.Id)] = 1; });
    if (!bsRep) return null; walk(bsRep).forEach(function (l) { if (l.kind === 'row' && l.id && ids[String(l.id)]) { hit = true; tot += val(l) || 0; } });
    return hit ? Math.round(tot * 100) / 100 : null;
  }
  // A period with no Tax Summary rows is a nil period only if QuickBooks returns GST for the agency over the company's
  // history (gst_probe). Otherwise the connector may not be passing agency_id, so GST is unavailable, not zero.
  function gstConfirmed(ctx, probeId) { var p = ctx.data[probeId]; return !!(p && !ctx.errors[probeId] && !noData(p)); }
  // A US company's Tax Summary answers 400 Permission Denied (5020): no GST there, so N/A, not a failure (live QA, 4 Oct 2026)
  function gstUS(ctx, ids) {
    var hit = ids.some(function (id) { var e = ctx.errors[id]; return e && /permission denied|\b5020\b/i.test(e.message || ''); });
    return hit && /^(us|usa|united states)$/i.test(ctx.country || '') ? GST_US : null;
  }
  var GST_US = 'This is a US company: it collects sales tax, not GST, so QuickBooks has no GST Tax Summary for it.', GST_US_NA = 'GST (US company: sales tax, no GST)';
  var GST_UNCONFIRMED = 'QuickBooks returned no GST figures for this tax agency in this period or at any time before it, so GST is unavailable, not zero. If this company records GST, the QuickBooks connector may not be passing the tax agency (agency_id).';
  // GST liability account on the balance sheet ("GST Liabilities Payable", "BAS Liabilities Payable", "GST Payable", "GST Control")
  var GST_LIAB_RE = /^(gst|bas)\b.*\b(liabilit(y|ies)|payable|control)\b|^tax (payable|control)$/i;
  // Tax agency for the TaxSummary report: QuickBooks returns BAS figures only when agency_id names the agency. Keeps the
  // declared input's agency when it exists, else the ATO, else the company's only agency; when that differs from the input
  // (e.g. first open with no id) it sets the input, which refetches. Returns {id, name, all, pending}.
  var ATO_RE = /australian tax(ation)? office|^ato$/i;
  function taxAgency(ctx, listId, input) {
    var all = ((ctx.data[listId] || {}).QueryResponse || {}).TaxAgency || [], cur = ctx.inputs[input], pick = null;
    all.forEach(function (a) { if (String(a.Id) === String(cur)) pick = a; });
    if (!pick) pick = all.filter(function (a) { return ATO_RE.test(a.DisplayName || a.Name || ''); })[0] || (all.length === 1 ? all[0] : null);
    var pending = !!(pick && String(pick.Id) !== String(cur) && ctx.live);
    if (pending) setTimeout(function () { var p = {}; p[input] = String(pick.Id); ctx.change(p); }, 0);
    return { id: pick ? String(pick.Id) : null, name: pick ? (pick.DisplayName || pick.Name || 'Tax agency ' + pick.Id) : null, all: all, pending: pending };
  }
  // Profit line names: US 'Net Income', AU/UK 'Profit for the year', 'Net Earnings', 'Current Year Earnings'.
  var NI_RE = /^(net (income|earnings|profit)|profit (\(loss\) )?for the (year|period)|current year (earnings|profit))$/i;
  // Balance Sheet totals by structure, not wording. AU companies can have no 'Total liabilities' line and call equity
  // 'Total shareholders' equity'. Returns lines (or null) for A, L, E, LE, CA, CL and the current-year profit row (ni).
  // When QuickBooks has no liabilities total, L is the sum of the liabilities-and-equity sections other than equity (L.derived).
  function bsParts(lines) {
    var A = find(lines, 'TotalAssets', /^total assets$/i), LE = find(lines, 'TotalLiabilitiesAndEquity', /^total liabilities and .*equity$/i);
    var E = find(lines, 'Equity', /^total ([a-z]+['\u2019]?s?['\u2019]?\s)?equity$/i), L = find(lines, 'Liabilities', /^total liabilities$/i);
    var CA = find(lines, 'CurrentAssets', /^total current assets:?$/i), CL = find(lines, 'CurrentLiabilities', /^total current liabilities:?$/i);
    if (LE) {
      var i = lines.indexOf(LE), hdr = null, j;
      for (j = i - 1; j >= 0; j--) if (lines[j].kind === 'header' && lines[j].depth === LE.depth) { hdr = lines[j]; break; }
      if (hdr) {
        var kids = lines.filter(function (l) { return l.kind !== 'header' && l.depth === LE.depth + 1 && l.path.length === LE.depth + 1 && l.path[LE.depth] === hdr.label; });
        if (!E) E = kids.filter(function (l) { return l.kind === 'total' && /equity/i.test(l.label); })[0] || null;
        if (!L && E) { var rest = kids.filter(function (l) { return l !== E; });
          if (rest.length) L = { kind: 'total', derived: true, depth: LE.depth + 1, path: LE.path.concat(hdr.label), label: 'Total liabilities', group: '', values: E.values.map(function (_, k) { return sum(rest.map(function (l) { return l.values[k]; })); }) }; }
      }
    }
    var ni = find(lines, null, NI_RE, 'row');
    if (!ni) ni = lines.filter(function (l) { return l.kind === 'row' && !l.id && l.path.some(function (p) { return /equity/i.test(p); }) && /profit|income|earnings/i.test(l.label) && !/retained/i.test(l.label); })[0] || null;
    return { A: A, L: L, E: E, LE: LE, CA: CA, CL: CL, ni: ni };
  }
  function val(line, col) { return line ? line.values[col == null ? line.values.length - 1 : col] : null; }
  function header(rep) { return (rep && rep.Header) || {}; }
  function noData(rep) {
    var o = header(rep).Option || [];
    for (var i = 0; i < o.length; i++) if (o[i].Name === 'NoReportData' && String(o[i].Value) === 'true') return true;
    return !(rep && rep.Rows && rep.Rows.Row && rep.Rows.Row.length);
  }

  // ---------- company, fiscal year, currency ----------
  function companyInfo(q) {
    var list = q && q.QueryResponse && q.QueryResponse.CompanyInfo;
    var ci = (list && list[0]) || (q && q.CompanyInfo) || null;
    return ci ? { name: ci.CompanyName || ci.LegalName || null, legal: ci.LegalName || null, country: ci.Country || null, fyMonth: ci.FiscalYearStartMonth || null } : null;
  }
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function monthIdx(m) {
    if (m == null) return null;
    if (typeof m === 'number') return m >= 1 && m <= 12 ? m : null;
    var i = MONTHS.map(function (x) { return x.toLowerCase(); }).indexOf(String(m).toLowerCase());
    return i >= 0 ? i + 1 : null;
  }
  // Returns {month:1-12, source:'CompanyInfo'|'Preferences'|'Fallback (1 July)'}
  function fiscalStart(ciResp, prefsResp) {
    var ci = companyInfo(ciResp), m = ci && monthIdx(ci.fyMonth);
    if (m) return { month: m, source: 'CompanyInfo' };
    var p = prefsResp && (prefsResp.Preferences || prefsResp);
    m = p && p.AccountingInfoPrefs && monthIdx(p.AccountingInfoPrefs.FirstMonthOfFiscalYear);
    if (m) return { month: m, source: 'Preferences' };
    return { month: 7, source: 'Fallback (1 July)' };
  }
  function homeCurrency(prefsResp, rep) {
    var h = header(rep).Currency;
