<style>
  .sentence { max-width: 40rem; margin: 0; color: var(--foreground); }
</style>
<ws-stack gap="5">
  <ws-row id="loading" gap="2"><ws-spinner label="Loading your answers"></ws-spinner><span class="ws-text-sm ws-text-muted">Loading your answers</span></ws-row>
  <ws-alert id="load-error" variant="destructive" heading="Your earlier answers could not be loaded" hidden>Reload the page to try again. Anything you choose now is still saved.</ws-alert>

  <ws-field id="zone-field" label="Time zone" description="Nudges and the summary go out at these times in this time zone." required>
    <ws-select id="time_zone" required>
      <option value="Australia/Sydney">Sydney, Canberra (AEST/AEDT)</option>
      <option value="Australia/Melbourne">Melbourne (AEST/AEDT)</option>
      <option value="Australia/Brisbane">Brisbane (AEST)</option>
      <option value="Australia/Adelaide">Adelaide (ACST/ACDT)</option>
      <option value="Australia/Darwin">Darwin (ACST)</option>
      <option value="Australia/Perth">Perth (AWST)</option>
      <option value="Australia/Hobart">Hobart (AEST/AEDT)</option>
      <option value="Pacific/Auckland">Auckland (NZST/NZDT)</option>
      <option value="Asia/Manila">Manila (PHT)</option>
      <option value="Asia/Singapore">Singapore (SGT)</option>
    </ws-select>
  </ws-field>

  <ws-row gap="4" wrap>
    <ws-field id="day-field" label="Check-in day" required>
      <ws-select id="checkin_day" required>
        <option value="monday">Monday</option>
        <option value="tuesday">Tuesday</option>
        <option value="wednesday">Wednesday</option>
        <option value="thursday">Thursday</option>
        <option value="friday">Friday</option>
      </ws-select>
    </ws-field>
    <ws-field id="time-field" label="Check-in time" required>
      <ws-input id="checkin_time" type="time" step="900" required></ws-input>
    </ws-field>
  </ws-row>

  <ws-field id="summary-field" label="Summary day" description="The day the reviewer gets the summary to approve." required>
    <ws-select id="summary_day" required>
      <option value="monday">Monday</option>
      <option value="tuesday">Tuesday</option>
      <option value="wednesday">Wednesday</option>
      <option value="thursday">Thursday</option>
      <option value="friday">Friday</option>
    </ws-select>
  </ws-field>

  <ws-alert id="order-warning" variant="warning" heading="The summary comes before the check-in" hidden>
    <span id="order-warning-text"></span>
  </ws-alert>

  <ws-card heading="Your schedule">
    <p id="sentence" class="sentence" aria-live="polite"></p>
  </ws-card>

  <p id="save-state" class="ws-text-sm ws-text-muted" aria-live="polite"></p>
</ws-stack>
<script>
(() => {
  const ZONES = {
    'Australia/Sydney': 'Sydney', 'Australia/Melbourne': 'Melbourne', 'Australia/Brisbane': 'Brisbane',
    'Australia/Adelaide': 'Adelaide', 'Australia/Darwin': 'Darwin', 'Australia/Perth': 'Perth',
    'Australia/Hobart': 'Hobart', 'Pacific/Auckland': 'Auckland', 'Asia/Manila': 'Manila', 'Asia/Singapore': 'Singapore',
  };
  const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
  const TIME = /^([01][0-9]|2[0-3]):[0-5][0-9]$/;
  const el = (id) => document.getElementById(id);
  const zone = el('time_zone');
  const day = el('checkin_day');
  const time = el('checkin_time');
  const summary = el('summary_day');
  const fields = { time_zone: el('zone-field'), checkin_day: el('day-field'), checkin_time: el('time-field'), summary_day: el('summary-field') };
  const controls = { time_zone: zone, checkin_day: day, checkin_time: time, summary_day: summary };
  const label = (d) => d.charAt(0).toUpperCase() + d.slice(1);
  const setError = (key, message) => (message ? fields[key].setAttribute('error', message) : fields[key].removeAttribute('error'));

  function problemFor(key) {
    const value = String(controls[key].value || '');
    if (key === 'time_zone') return ZONES[value] ? null : 'Choose a time zone.';
    if (key === 'checkin_time') return TIME.test(value) ? null : 'Enter a time, for example 9:00am.';
    return DAYS.includes(value) ? null : 'Choose a day.';
  }
  const allValid = () => Object.keys(controls).every((key) => problemFor(key) === null);
  const allowContinue = () => workspace.wizard.setCanContinue({ value: allValid() }).catch(() => {});

  function clock(value) {
    if (!TIME.test(value)) return null;
    const [h, m] = value.split(':').map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`;
  }

  function describe() {
    const when = clock(time.value);
    if (!allValid() || !when) {
      el('sentence').textContent = 'Choose a time zone, check-in day and time, and summary day to see your schedule.';
    } else {
      el('sentence').textContent = `Your team gets a nudge every ${label(day.value)} at ${when} (${ZONES[zone.value]} time) and a summary every ${label(summary.value)}.`;
    }
    const early = DAYS.includes(day.value) && DAYS.includes(summary.value) && DAYS.indexOf(summary.value) < DAYS.indexOf(day.value);
    el('order-warning').hidden = !early;
    if (early) {
      el('order-warning-text').textContent = `A ${label(summary.value)} summary would only cover the previous week's check-ins. Choose ${label(day.value)} or later if you want it to cover the same week.`;
    }
  }

  let pending = 0;
  async function save(values) {
    pending += 1;
    el('save-state').textContent = 'Saving';
    try {
      await workspace.setup.save({ values });
      el('save-state').textContent = pending > 1 ? 'Saving' : 'Saved';
    } catch (error) {
      for (const key of Object.keys(values)) setError(key, error && error.message ? `${error.message}. Try again.` : 'This could not be saved. Try again.');
      el('save-state').textContent = '';
      workspace.wizard.setCanContinue({ value: false }).catch(() => {});
    } finally {
      pending -= 1;
    }
  }

  for (const key of Object.keys(controls)) {
    controls[key].addEventListener('change', () => {
      const problem = problemFor(key);
      setError(key, problem);
      describe();
      allowContinue();
      if (!problem) save({ [key]: controls[key].value });
    });
  }

  (async () => {
    workspace.wizard.setCanContinue({ value: false }).catch(() => {});
    let saved = {};
    let loaded = false;
    try {
      saved = ((await workspace.setup.get()) || {}).settings || {};
      loaded = true;
    } catch {
      el('load-error').hidden = false;
    }
    let local = null;
    try { local = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { local = null; }
    const defaults = { time_zone: ZONES[local] ? local : 'Australia/Sydney', checkin_day: 'monday', checkin_time: '09:00', summary_day: 'friday' };
    const missing = {};
    for (const key of Object.keys(controls)) {
      controls[key].value = defaults[key];
      const value = saved[key];
      const ok = key === 'time_zone' ? Boolean(ZONES[value]) : key === 'checkin_time' ? TIME.test(String(value || '')) : DAYS.includes(value);
      if (ok) controls[key].value = value;
      else missing[key] = defaults[key];
    }
    el('loading').hidden = true;
    describe();
    allowContinue();
    if (loaded && Object.keys(missing).length > 0) save(missing);
  })();
})();
</script>
