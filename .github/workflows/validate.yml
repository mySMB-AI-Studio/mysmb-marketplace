name: validate

# Runs on every PR (any target) and on pushes to each long-lived branch tier so
# main, staging, and dev all stay valid — including the env-agnostic-URL rule.
on:
  pull_request:
  push:
    branches: [main, staging, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run marketplace validator
        run: npx --yes tsx scripts/validate.ts
