name: validate

# Runs on every PR (any target, so PRs into dev/qa/uat/main are all covered) and
# on pushes to each branch tier — dev → qa → uat → main — so every tier stays
# valid, including the env-agnostic-URL rule. Pushes include the AI Studio's
# auto-commits to dev and its publish/promote commits to qa/uat/main; a failure
# on those surfaces in the AI Studio promotion log. `staging` is retired but
# kept here until the branch is archived (rollback only).
on:
  pull_request:
  push:
    branches: [main, uat, qa, dev, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run marketplace validator
        run: npx --yes tsx scripts/validate.ts
